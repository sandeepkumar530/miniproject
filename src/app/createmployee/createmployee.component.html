<p>createmployee works!</p><div class="crt">
<form [formGroup]="employeeForm">
<label>Name:</label>
<input type="text" formControlName="name"><br>
<label>Company:</label>
<input type="text" formControlName="company"><br>
<label>Role:</label>
<input type="text" formControlName="role"><br>
<label>Package:</label>
<input type="number" formControlName="package"><br>
<label>Email:</label>
<input type="email" formControlName="email"><br>
<label>DOB:</label>
<input type="date" formControlName="dob"><br>


<h1>Address</h1>
<div formGroupName="address">
    <label>AddressLine:</label>
<input type="text" formControlName="addressline"><br>
<label>City:</label>
<input type="text" formControlName="city"><br>
<label>State:</label>
<input type="text" formControlName="state"><br>
<label>Pincode:</label>
<input type="number" formControlName="pincode"><br>

<button (click)="submit()">Submit</button>
</div>

<label>WorkMode:</label>
<input type="radio" name="workmode" formControlName="workmode" value="workfromoffice">
<label>WorkFromOffice</label>
<input type="radio" name="workmode" formControlName="workmode" value="remote">
<label>Remote</label><br>

<div *ngIf="employeeForm.get('workmode')?.value=='workfromoffice'">
<label>TravelFee:</label>
<input type="number" formControlName="travelfee"><br>
</div>
<div *ngIf="employeeForm.get('workmode')?.value=='remote'">
    <label>WifiBill:</label>
    <input type="number" formControlName="wifibill"><br>
</div>

<label>Hikes:</label>
<button (click)="addhike()" class="btn btn-primary">ADD Hike</button><br><br>
 <div formArrayName="hikes">
    <div *ngFor="let hike of hikesFormArray.controls; let i=index">
        <div formGroupName="{{i}}">
            <h2>hike{{i+1}}</h2>
            <label>Year:</label>
            <input type="number" formControlName="year"><br>
            <label>Percentage:</label>
            <input type="number" formControlName="percentage"><br>

            <button (click)="deletehike(i)" class="btn btn-danger">RemoveHike</button>
        </div>
    </div>
 </div></form>
</div>
